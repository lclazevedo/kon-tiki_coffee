.qr { width: 56mm; margin: 0 auto; }
.qr svg { display: block; width: 100%; height: auto; }
.scan { margin: 3mm 0 0; font: bold 12pt system-ui, sans-serif; }
.scan span { display: block; font-weight: normal; color: #7a6a5d; }
.url { margin-top: 3mm; font: 8pt ui-monospace, Consolas, monospace; color: #7a6a5d; word-break: break-all; }
